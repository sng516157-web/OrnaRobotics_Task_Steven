# Kinematic solver for the "arm" planning group.
# TRAC-IK is far more robust than KDL for OMPL pose-goal sampling on this
# long chain (UR5e + fixed gripper links); KDL remains the fallback.
arm:
  kinematics_solver: trac_ik_kinematics_plugin/TRAC_IKKinematicsPlugin
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 3
  solve_type: Distance
  position_only_ik: false
