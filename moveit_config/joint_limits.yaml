# Conservative limits for initial testing; the URDF provides position and
# velocity limits, MoveIt needs acceleration limits here.
default_velocity_scaling_factor: 0.2
default_acceleration_scaling_factor: 0.2

joint_limits:
  shoulder_pan_joint:
    has_acceleration_limits: true
    max_acceleration: 2.0
  shoulder_lift_joint:
    has_acceleration_limits: true
    max_acceleration: 2.0
  elbow_joint:
    has_acceleration_limits: true
    max_acceleration: 2.0
  wrist_1_joint:
    has_acceleration_limits: true
    max_acceleration: 2.0
  wrist_2_joint:
    has_acceleration_limits: true
    max_acceleration: 2.0
  wrist_3_joint:
    has_acceleration_limits: true
    max_acceleration: 2.0
